name = "ramu-shogi"
# account_id は環境変数 CLOUDFLARE_ACCOUNT_ID で設定（wrangler login でも自動解決）
compatibility_date = "2026-01-20"

# Workerエントリーポイント（COOPヘッダー追加用）
main = "./worker/index.ts"
# custom_domains = ["ramu-shogi.sh11235.com"]

# backend 分離後に /api/* を proxy する場合に設定
# [vars]
# BACKEND_ORIGIN = "https://api.ramu-shogi.com"

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA用設定: 404時にindex.htmlを返す
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "NNUE_BUCKET"
bucket_name = "shogi-nnue"

# Durable Objects バインディング
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Rate Limiting: POST /api/rooms への IP ごとのレート制限
# namespace_id は Cloudflare Dashboard > Workers > Rate Limiting で作成し設定する
[[unsafe.bindings]]
name = "ROOM_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"

[unsafe.bindings.simple]
limit = 10
period = 60

[env.stg]
name = "ramu-shogi-stg"
# custom_domains = ["ramu-shogi-stg.sh11235.workers.dev"]
# staging用の環境変数/Binding/DB等を分ける
# vars = { ... }
# BACKEND_ORIGIN = "https://stg-api.ramu-shogi.com"

[[env.stg.r2_buckets]]
binding = "NNUE_BUCKET"
bucket_name = "shogi-nnue"

[[env.stg.durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[env.stg.migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
