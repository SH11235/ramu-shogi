[workspace]
resolver = "2"
members = [
    "crates/engine-wasm",
    "crates/shogi-rules-wasm",
]

[workspace.dependencies]
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
serde_yaml  = "0.9"
flate2 = "1.0"
chrono = "0.4"
anyhow      = "1.0"
log         = "0.4"
once_cell = "1.19"
clap = { version = "4.5.47", features = ["derive"] }
env_logger = "0.11"
rand = "0.9"
rand_xoshiro = "0.7"
regex = "1.11.2"
smallvec = "1.15"
# getrandom with wasm_js feature for WebAssembly support
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }
# 将棋のルール実装は engine-wasm と shogi-rules-wasm で同じ rev を共有する
rshogi-core = { git = "https://github.com/SH11235/rshogi.git", rev = "7e74f8dae4999cd9fbaf36d9e7124ceb3dabf862", default-features = false }


# Debug build optimizations for reasonable test performance
# TT operations with SIMD and CAS loops are extremely slow without optimization
[profile.dev]
opt-level = 1  # Basic optimizations for debug builds
panic = "unwind"

# Release build - 開発時用（高速ビルド）
[profile.release]
opt-level = 3
overflow-checks = true    # オーバーフロー検出（安全性重視）
lto = "thin"              # 高速なLTO
codegen-units = 4         # 並列ビルド
panic = "unwind"
strip = "symbols"

# Production build - 本番デプロイ用（最大最適化）
# 使用方法: cargo build --profile production
[profile.production]
inherits = "release"
overflow-checks = false   # 本番では無効化（速度優先）
lto = "fat"               # 最大LTO
codegen-units = 1         # 最適化優先
panic = "abort"           # 小さいバイナリ

# サーバー側の合法手検証用。探索をしないので速度よりサイズを優先する
[profile.rules-wasm]
inherits = "production"
opt-level = "z"
