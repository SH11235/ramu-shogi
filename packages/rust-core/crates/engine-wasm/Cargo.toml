[package]
name = "engine-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Wasm bindings for the shogi engine core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rshogi-core = { git = "https://github.com/SH11235/rshogi.git", rev = "9f19e70490541f8e802e527fb68544534fc09b52", default-features = false, features = ["edition-universal"] }
wasm-bindgen = { version = "0.2.106", features = ["serde-serialize"] }
wasm-bindgen-rayon = { version = "1.2", optional = true }
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"

[features]
default = []
wasm-threads = ["rshogi-core/wasm-threads", "wasm-bindgen-rayon"]

[target.wasm32-unknown-unknown.dependencies]
getrandom = { workspace = true }
console_error_panic_hook = "0.1"
