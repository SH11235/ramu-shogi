name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/rust-core/**'
      - 'apps/desktop/src-tauri/**'
      - 'rustfmt.toml'
      - '.github/workflows/rust-ci.yml'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_NIGHTLY_TOOLCHAIN: nightly-2025-12-25

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/rust-core

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust_code: ${{ steps.filter.outputs.rust_code }}
      tauri_code: ${{ steps.filter.outputs.tauri_code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            rust_code:
              - 'rustfmt.toml'
              - 'packages/rust-core/shared/**'
              - 'packages/rust-core/Cargo.toml'
              - 'packages/rust-core/Cargo.lock'
              - 'packages/rust-core/build.rs'
              - 'packages/rust-core/crates/**'
              - 'packages/rust-core/.cargo/**'
              - '!packages/rust-core/docs/**'
              - '!packages/rust-core/runs/**'
              - '!packages/rust-core/logs/**'
              - '!packages/rust-core/target/**'
              - '!packages/rust-core/data/**'
              - '!packages/rust-core/memo/**'
              - '!**/*.md'
              - '!**/*.mdx'
            tauri_code:
              - 'rustfmt.toml'
              - 'packages/rust-core/shared/**'
              - 'apps/desktop/src-tauri/Cargo.toml'
              - 'apps/desktop/src-tauri/Cargo.lock'
              - 'apps/desktop/src-tauri/build.rs'
              - 'apps/desktop/src-tauri/src/**'
              - '!**/*.md'
              - '!**/*.mdx'

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_code == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  format-tauri:
    name: Format Check (tauri)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tauri_code == 'true'
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Clippy Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_code == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "packages/rust-core -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  lint-tauri:
    name: Clippy Lint (tauri)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tauri_code == 'true'
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install system deps (GTK/WebKit for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            patchelf \
            curl \
            wget \
            file
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Note: packages/rust-core only contains thin wrappers for rshogi-core (engine-wasm, shogi-rules-wasm)
  # Most tests are in rshogi-core (https://github.com/SH11235/rshogi)
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "packages/rust-core -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: cargo test --release --workspace

  test-tauri:
    name: Test (tauri)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tauri_code == 'true'
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install system deps (GTK/WebKit for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            patchelf \
            curl \
            wget \
            file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: cargo test --release --workspace -- --test-threads=2

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_code == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Run security audit
        run: cargo audit --deny warnings

  wasm32:
    name: Wasm (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust_code == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Setup Rust nightly (wasm threads)
        run: |
          rustup toolchain install "${RUST_NIGHTLY_TOOLCHAIN}"
          rustup component add rust-src --toolchain "${RUST_NIGHTLY_TOOLCHAIN}"
      - name: Resolve wasm-bindgen version
        run: |
          WASM_BINDGEN_VERSION=$(awk -F '"' '/^name = "wasm-bindgen"$/ {getline; print $2; exit}' Cargo.lock)
          if [ -z "$WASM_BINDGEN_VERSION" ]; then
            echo "Failed to resolve wasm-bindgen version"; exit 1;
          fi
          echo "WASM_BINDGEN_VERSION=$WASM_BINDGEN_VERSION" >> "$GITHUB_ENV"
          echo "wasm-bindgen version: $WASM_BINDGEN_VERSION"
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "packages/rust-core -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore threaded wasm target
        id: threaded-target
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/wasm-threaded-target
          key: wasm-threaded-${{ runner.os }}-${{ env.RUST_NIGHTLY_TOOLCHAIN }}-release-${{ hashFiles('packages/rust-core/Cargo.lock', 'packages/rust-core/**/Cargo.toml', 'packages/rust-core/targets/**', 'packages/engine-wasm/scripts/build-wasm.mjs') }}
      - name: Build wasm bindings
        run: node scripts/build-wasm.mjs
        working-directory: packages/engine-wasm
        env:
          ENGINE_WASM_THREADED_TARGET_DIR: ${{ runner.temp }}/wasm-threaded-target
      - name: Save threaded wasm target
        if: github.ref == 'refs/heads/main' && steps.threaded-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/wasm-threaded-target
          key: wasm-threaded-${{ runner.os }}-${{ env.RUST_NIGHTLY_TOOLCHAIN }}-release-${{ hashFiles('packages/rust-core/Cargo.lock', 'packages/rust-core/**/Cargo.toml', 'packages/rust-core/targets/**', 'packages/engine-wasm/scripts/build-wasm.mjs') }}
      - name: Build rules wasm
        run: cargo build --profile rules-wasm --target wasm32-unknown-unknown -p shogi-rules-wasm
