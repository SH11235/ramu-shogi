name: Frontend contract self-consistency

on:
  push:
    branches: [main]
    paths:
      - "packages/api-contract/**"
      - "packages/match-protocol/**"
      - "scripts/*contract*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/contract-consistency.yml"
  pull_request:
    paths:
      - "packages/api-contract/**"
      - "packages/match-protocol/**"
      - "scripts/*contract*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/contract-consistency.yml"

permissions:
  contents: read

jobs:
  frontend-self-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
      - id: versions
        run: |
          echo "node=$(node -p "require('./package.json').volta.node")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check scripts/contract-check.mjs scripts/contract-check.test.mjs scripts/check-frontend-contracts.mjs scripts/check-backend-contracts.mjs
      - run: pnpm test:contracts
      - name: Check stored OpenAPI and TypeScript (backend synchronization is a local release gate)
        run: pnpm check:contracts:frontend
      - run: pnpm --filter @shogi/api-contract --filter @shogi/match-protocol typecheck
