# Desktop app release workflow with PGO optimization
name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
            cpu_target: x86-64-v3
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64
            cpu_target: x86-64-v3
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-arm64
            cpu_target: apple-m1

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Resolve versions
        id: versions
        shell: bash
        run: |
          NODE_VERSION=$(node -p "require('./package.json').volta.node" 2>/dev/null || echo "")
          if [ -z "$NODE_VERSION" ]; then
            echo "Error: Failed to resolve node version from package.json"
            exit 1
          fi
          echo "node=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: 'pnpm'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/rust-core -> target
            apps/desktop/src-tauri -> target
          cache-on-failure: true
          shared-key: "rust-desktop-${{ matrix.platform }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # =======================================================================
      # TODO: PGO (Profile-Guided Optimization) ビルドの再有効化
      # =======================================================================
      #
      # 現在、rshogi-core を crates.io から取得する構成に移行したため、
      # PGO ビルドに必要な benchmark バイナリが利用できません。
      #
      # 将来的に PGO を再有効化する際の選択肢:
      #   1. rshogi リポジトリに benchmark を移動し、別途ビルド
      #   2. ramu-shogi に簡易ベンチマーク用クレートを追加
      #   3. rshogi-core に benchmark feature を追加
      #
      # PGO の効果（以前の計測結果）:
      #   - NNUE評価: +6〜7% NPS向上
      #   - Material評価: +14% NPS向上
      #
      # =======================================================================

      # Build Tauri app
      - name: Build Tauri App
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "=== Building Tauri ==="
          echo "CPU target: ${{ matrix.cpu_target }}"
          export RUSTFLAGS="-C target-cpu=${{ matrix.cpu_target }}"
          pnpm tauri build --target ${{ matrix.target }}

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      # Upload artifacts
      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact_suffix }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact_suffix }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact_suffix }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Desktop v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
